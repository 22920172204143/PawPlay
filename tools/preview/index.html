<!doctype html>
<html lang="zh-CN">

<header><div><span class="eyebrow">PawPlay / 头部比例与动作节奏</span><h1>红黄小瓢虫</h1><p>先核对造型、比例与颜色，再继续打磨动作和光效。</p></div><span class="badge">待视觉验收</span></header>
<main>
  <section class="comparison">
    <article><div class="panel-title"><h2>视频参考</h2><span>13 秒 · 局部放大</span></div><div class="reference"><img src="/.local/reviews/p1/reference-front.png" alt="原视频第13秒的瓢虫局部"></div><p class="caption">来自你提供的视频。保留原始细节，仅裁剪和放大。</p></article>
    <article><div class="panel-title"><h2>本轮 3D 模型</h2><span id="status" role="status">正在加载…</span></div><div id="viewport"></div><p class="caption">可独立开合的翅壳、腹部、头部和卷曲触角；同一 GLB 用于 Android。</p></article>
  </section>
  <div class="controls">
    <div class="buttons"><button id="front" class="selected">俯视对比</button><button id="volume">旋转观察</button><button id="scale">参考尺寸</button><button id="play">播放动作</button><button id="compare" disabled>查看上一版</button></div>
    <label>动作节奏 <select id="motion"><option value="auto">自然变化</option><option value="gentle">缓慢开合</option><option value="flutter">短促连拍</option><option value="spread">展翅停留</option><option value="settle">轻收停顿</option></select><span id="motion-state">动作已暂停</span></label>
    <label>翅壳开合 <input id="opening" type="range" min="0" max="55" step="0.5" value="13"><output id="angle">13°</output></label>
  </div>
  <div class="note"><strong>本轮看什么</strong><span>头部放大约 40%，加强亮黄到橙黄的渐变，拉开两根触角的形状差异。点击播放，观察慢开合、短连拍、展翅与轻收之间的自然切换；也可单独选择动作。移动、光晕和星星拖尾仍待下一阶段对齐。</span></div>
